  <script>
    // Paint the lightweight room before requesting the engine. No extra images,
    // fonts, timers, audio, saved-data access or artificial minimum wait.
    const loadingOverlay = document.getElementById('status');
    const loadingProgress = document.getElementById('status-progress');
    const loadingLabel = document.getElementById('status-label');
    const loadingPercent = document.getElementById('status-percent');
    const loadingStars = Array.from(document.querySelectorAll('.puzzle-star'));
    let loadingFinished = false;
    function showLoadingFailure(error) {
      if (loadingFinished) return;
      loadingFinished = true;
      loadingOverlay.dataset.phase = 'error';
      loadingOverlay.setAttribute('aria-busy', 'false');
      const notice = document.getElementById('status-notice');
      notice.textContent = 'The puzzle room couldn’t open. Check your connection and try again.';
      notice.hidden = false;
      document.getElementById('retry').hidden = false;
      console.error(error);
    }
    document.getElementById('retry').addEventListener('click', () => window.location.reload());
    function updateLoadingProgress(current, total) {
      if (loadingFinished) return;
      if (!Number.isFinite(current) || !Number.isFinite(total) || current <= 0 || total <= 0) return;
      const fraction = Math.min(1, Math.max(0, current / total));
      const opening = fraction >= 1;
      loadingOverlay.dataset.phase = opening ? 'opening' : 'downloading';
      loadingProgress.max = total;
      loadingProgress.value = Math.min(current, total);
      loadingLabel.textContent = opening ? 'Opening your puzzle room…' : 'Gathering your puzzles…';
      loadingPercent.textContent = opening ? '' : Math.min(99, Math.floor(fraction * 100 + 1e-7)) + '%';
      document.getElementById('track-fill').style.transform = 'scaleX(' + fraction + ')';
      document.getElementById('constellation').style.strokeDashoffset = String(100 * (1 - fraction));
      loadingStars.forEach((star, i) => star.classList.toggle('lit', fraction >= (i + 1) / loadingStars.length));
    }
  </script>
